<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Namer</title>
  <meta name="description" content="AI-агент, который подбирает названия продукта по описанию на веб-странице.">
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #16181d;
      --muted: #5d6573;
      --border: #e2e5ea;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eef0ff;
      --error-bg: #fdecec;
      --error-text: #a12020;
      --success: #13795b;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 4px 16px rgba(16, 24, 40, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --surface: #181b21;
        --text: #eceef2;
        --muted: #a1a8b5;
        --border: #2a2f38;
        --accent: #818cf8;
        --accent-hover: #a5b4fc;
        --accent-soft: #23264a;
        --error-bg: #3a1a1c;
        --error-text: #ffb4b4;
        --success: #4ade80;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 860px; margin: 0 auto; padding: 56px 16px 64px; }
    header h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 40px); letter-spacing: -0.02em; }
    header p { margin: 0 0 32px; color: var(--muted); max-width: 640px; }

    .form {
      display: flex; gap: 12px; flex-wrap: wrap;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow);
    }
    .form label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .form input {
      flex: 1 1 320px; min-width: 0;
      font: inherit; color: var(--text); background: transparent;
      border: 1px solid transparent; border-radius: 10px; padding: 12px 14px; outline: none;
    }
    .form input:focus { border-color: var(--accent); }
    button {
      font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid transparent;
      transition: background-color .15s, border-color .15s, color .15s, opacity .15s;
    }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .primary {
      flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 12px 22px; background: var(--accent); color: #fff; font-weight: 600;
    }
    @media (prefers-color-scheme: dark) { .primary { color: #0f1115; } }
    .primary:hover:not(:disabled) { background: var(--accent-hover); }
    .primary:disabled { opacity: .65; cursor: progress; }
    @media (max-width: 520px) { .primary { width: 100%; } }

    .spinner {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid currentColor; border-right-color: transparent;
      animation: spin .8s linear infinite; display: none;
    }
    .loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status { margin: 20px 0 0; color: var(--muted); min-height: 1.5em; }
    .error {
      margin-top: 20px; padding: 14px 16px; border-radius: 10px;
      background: var(--error-bg); color: var(--error-text);
    }
    [hidden] { display: none !important; }

    .results-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      margin: 36px 0 16px;
    }
    .results-head h2 { margin: 0; font-size: 20px; }
    .source { margin: 4px 0 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
    .secondary {
      padding: 8px 14px; background: var(--surface); color: var(--text); border-color: var(--border);
      font-size: 14px; white-space: nowrap;
    }
    .secondary:hover { border-color: var(--accent); color: var(--accent); }
    .secondary.copied { border-color: var(--success); color: var(--success); }

    .cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .card {
      display: grid; grid-template-columns: auto 1fr auto; gap: 4px 16px; align-items: start;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px 18px; box-shadow: var(--shadow);
    }
    .num {
      grid-row: span 2; width: 32px; height: 32px; border-radius: 50%;
      display: grid; place-items: center; font-weight: 600; font-size: 14px;
      background: var(--accent-soft); color: var(--accent);
    }
    .card h3 { margin: 2px 0 0; font-size: 20px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
    .card p { grid-column: 2 / 4; margin: 0; color: var(--muted); }
    .card .secondary { grid-column: 3; grid-row: 1; }
    @media (max-width: 520px) {
      .card { grid-template-columns: auto 1fr; }
      .card p { grid-column: 1 / 3; }
      .card .secondary { grid-column: 1 / 3; grid-row: auto; justify-self: start; }
      .num { grid-row: auto; }
    }
    .note { margin-top: 24px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Product Namer</h1>
      <p>Вставьте ссылку на статью или страницу с описанием продукта. AI-агент изучит текст и предложит 5 названий с пояснениями.</p>
    </header>

    <form class="form" id="form" novalidate>
      <label for="url">Адрес страницы</label>
      <input id="url" name="url" type="url" inputmode="url" autocomplete="url" required
             placeholder="https://example.com/product" maxlength="2048">
      <button class="primary" id="submit" type="submit">
        <span class="spinner" aria-hidden="true"></span>
        <span id="submit-label">Подобрать названия</span>
      </button>
    </form>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="error" id="error" role="alert" hidden></div>

    <section id="results" hidden aria-labelledby="results-title">
      <div class="results-head">
        <div>
          <h2 id="results-title">Варианты названий</h2>
          <p class="source" id="source"></p>
        </div>
        <button class="secondary" id="copy-all" type="button">Копировать все</button>
      </div>
      <ol class="cards" id="cards"></ol>
      <p class="note">Названия сгенерированы автоматически. Перед использованием проверьте их по базам товарных знаков и доступность доменов.</p>
    </section>
  </main>

  <script>
    (function () {
      "use strict";
      var REQUEST_TIMEOUT_MS = 180000;
      var form = document.getElementById("form");
      var input = document.getElementById("url");
      var submit = document.getElementById("submit");
      var submitLabel = document.getElementById("submit-label");
      var statusEl = document.getElementById("status");
      var errorEl = document.getElementById("error");
      var results = document.getElementById("results");
      var cards = document.getElementById("cards");
      var sourceEl = document.getElementById("source");
      var copyAll = document.getElementById("copy-all");
      var currentNames = [];
      var busy = false;

      function setLoading(loading) {
        busy = loading;
        submit.disabled = loading;
        input.readOnly = loading;
        submit.classList.toggle("loading", loading);
        submitLabel.textContent = loading ? "Анализируем…" : "Подобрать названия";
        statusEl.textContent = loading ? "Загружаем страницу и анализируем продукт. Обычно это занимает 10–30 секунд." : "";
      }

      function showError(message) {
        errorEl.textContent = message;
        errorEl.hidden = false;
      }

      function isValidUrl(value) {
        try {
          var u = new URL(value);
          return (u.protocol === "http:" || u.protocol === "https:") && !!u.hostname;
        } catch (e) {
          return false;
        }
      }

      function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(text);
        }
        // Запасной вариант для http-страниц, где Clipboard API недоступен.
        return new Promise(function (resolve, reject) {
          var area = document.createElement("textarea");
          area.value = text;
          area.setAttribute("readonly", "");
          area.style.position = "fixed";
          area.style.opacity = "0";
          document.body.appendChild(area);
          area.select();
          try {
            document.execCommand("copy") ? resolve() : reject(new Error("copy failed"));
          } catch (e) {
            reject(e);
          } finally {
            document.body.removeChild(area);
          }
        });
      }

      function flash(button, text) {
        var original = button.dataset.label || button.textContent;
        button.dataset.label = original;
        copyText(text).then(function () {
          button.textContent = "Скопировано";
          button.classList.add("copied");
        }).catch(function () {
          button.textContent = "Не удалось";
        }).finally(function () {
          setTimeout(function () {
            button.textContent = original;
            button.classList.remove("copied");
          }, 1600);
        });
      }

      function render(data) {
        currentNames = data.names;
        cards.textContent = "";
        // Только textContent: ответ модели основан на недоверенной странице.
        data.names.forEach(function (item, index) {
          var li = document.createElement("li");
          li.className = "card";
          var num = document.createElement("span");
          num.className = "num";
          num.textContent = String(index + 1);
          var title = document.createElement("h3");
          title.textContent = item.name;
          var reason = document.createElement("p");
          reason.textContent = item.reason;
          var copy = document.createElement("button");
          copy.type = "button";
          copy.className = "secondary";
          copy.textContent = "Копировать";
          copy.setAttribute("aria-label", "Копировать название " + item.name);
          copy.addEventListener("click", function () { flash(copy, item.name); });
          li.append(num, title, copy, reason);
          cards.appendChild(li);
        });
        sourceEl.textContent = "Источник: " + data.source_url;
        results.hidden = false;
      }

      copyAll.addEventListener("click", function () {
        var text = currentNames.map(function (item, i) {
          return (i + 1) + ". " + item.name + " — " + item.reason;
        }).join("\n");
        flash(copyAll, text);
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        if (busy) return;
        errorEl.hidden = true;
        var url = input.value.trim();
        if (!isValidUrl(url)) {
          showError("Введите корректный адрес, начинающийся с http:// или https://");
          input.focus();
          return;
        }

        setLoading(true);
        var controller = new AbortController();
        var timer = setTimeout(function () { controller.abort(); }, REQUEST_TIMEOUT_MS);

        fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({ url: url }),
          signal: controller.signal
        }).then(function (response) {
          return response.json().catch(function () { return {}; }).then(function (body) {
            if (!response.ok) {
              throw new Error(body.detail || ("Ошибка сервера (HTTP " + response.status + ")."));
            }
            return body;
          });
        }).then(function (data) {
          render(data);
          results.scrollIntoView({ behavior: "smooth", block: "start" });
        }).catch(function (err) {
          if (err.name === "AbortError") {
            showError("Превышено время ожидания ответа. Попробуйте ещё раз.");
          } else if (err instanceof TypeError) {
            showError("Нет связи с сервером. Проверьте подключение и попробуйте снова.");
          } else {
            showError(err.message);
          }
        }).finally(function () {
          clearTimeout(timer);
          setLoading(false);
        });
      });
    })();
  </script>
</body>
</html>
